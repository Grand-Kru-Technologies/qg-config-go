name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build / vet / test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [go.mod, stable]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.go == 'go.mod'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - if: matrix.go == 'stable'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go version
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1 -race -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out | tail -1
